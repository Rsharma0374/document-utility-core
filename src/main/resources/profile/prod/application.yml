# Server configuration

server:
  port: 10005
  servlet:
    context-path: /doc-service

spring:
  application:
    name: doc-service
eureka:
  client:
    service-url:
      defaultZone: http://eureka.guardianservices.in:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health
logging:
  level:
    root: info


