# Server configuration

server:
  port: 10005
  servlet:
    context-path: /doc-service

spring:
  application:
    name: doc-service
  profiles:
    active: prod
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health
logging:
  level:
    root: info


